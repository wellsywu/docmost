server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  # Fallback path only. When the SPA is served through the nginx-proxy /md/
  # subpath, its API calls go to the page origin (/docmost-api/ on docmost.lan),
  # so they are handled one layer up and never reach this block. It stays for
  # direct container access and for the deploy script's reachability check.
  location /docmost-api/ {
    # Resolve `docmost` on every request instead of once at startup: a plain
    # `proxy_pass http://docmost:3000/api/` caches the IP nginx saw when it
    # booted, so redeploying Docmost alone (--skip-md, or the plain deploy
    # script) leaves this container proxying to a dead address until someone
    # restarts it. 127.0.0.11 is Docker's embedded DNS on docmost_net.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $docmost_upstream docmost;
    # rewrite + variable-only proxy_pass: with a variable in proxy_pass, nginx
    # will not do the location-prefix replacement itself, so the target URI has
    # to be built here.
    rewrite ^/docmost-api/(.*)$ /api/$1 break;
    proxy_pass http://$docmost_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
