services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      INTEGRATION_DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost_integrations'
      # Browser-facing URL of the doocs editor. Empty or unset hides the
      # "publish to WeChat" action in the page header.
      MD_EDITOR_URL: 'http://localhost:3080'
      # Origin the editor's browser loads Docmost images from. Defaults to
      # APP_URL; set it when the deployment answers on more than one hostname.
      DOOCS_ATTACHMENT_BASE_URL: '${DOOCS_ATTACHMENT_BASE_URL:-}'
      # Optional egress proxy for the WeChat account connection test, the only
      # WeChat call this container still makes.
      HTTP_PROXY: '${HTTP_PROXY:-}'
      HTTPS_PROXY: '${HTTPS_PROXY:-}'
      NO_PROXY: '${NO_PROXY:-}'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  md:
    build:
      context: ./vendor/doocs-md
      dockerfile: Dockerfile
    depends_on:
      docmost:
        condition: service_started
    ports:
      - "3080:80"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./packages/integration-db/docker/init-integration-database.sh:/docker-entrypoint-initdb.d/10-init-integration-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost && /docker-entrypoint-initdb.d/10-init-integration-database.sh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Opt-in WeChat draft connector: docker compose --profile publisher up -d
  publisher:
    profiles: ["publisher"]
    build:
      context: .
      dockerfile: apps/publisher/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      docmost:
        condition: service_started
    environment:
      PUBLISHER_DATABASE_URL: 'postgres://docmost:STRONG_DB_PASSWORD@db:5432/docmost_integrations'
      PUBLISHER_USE_MEMORY_STORE: '0'
      PUBLISHER_AUTH_ENABLED: '1'
      PUBLISHER_ACCESS_TOKEN: 'REPLACE_WITH_PUBLISHER_ACCESS_TOKEN'
      DOCMOST_BASE_URL: 'http://docmost:3000/api'
      DOCMOST_API_KEY: 'REPLACE_WITH_DOCMOST_API_KEY'
      WECHAT_MODE: 'mock'
      INTEGRATION_ENCRYPTION_SECRET: 'REPLACE_WITH_LONG_SECRET'
    ports:
      - "3050:3050"
    restart: unless-stopped

volumes:
  docmost:
  db_data:
  redis_data:
